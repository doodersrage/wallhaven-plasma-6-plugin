name: AUR publish

on:
  workflow_dispatch:
    inputs:
      pkgname:
        description: AUR package name
        required: true
        default: wallhaven-plasma-git
      version:
        description: Release version (matches metadata.json)
        required: true
        default: "3.4.1"
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository_owner != 'dependabot'
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "pkgname=${{ inputs.pkgname }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "pkgname=wallhaven-plasma-git" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate packaging files
        run: |
          test -f packaging/PKGBUILD
          grep -q 'wallhaven-plasma' packaging/PKGBUILD
          grep -q "pkgver=${{ steps.meta.outputs.version }}" packaging/PKGBUILD \
            || grep -q "pkgver=${{ steps.meta.outputs.version }}.r" packaging/PKGBUILD || {
            echo "PKGBUILD pkgver does not match ${{ steps.meta.outputs.version }}" >&2
            exit 1
          }

      - name: Publish to AUR (requires secret)
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "::warning::Set repository secret AUR_SSH_PRIVATE_KEY to enable automated AUR publish."
            exit 0
          fi
          eval "$(ssh-agent -s)"
          echo "${AUR_SSH_PRIVATE_KEY}" | ssh-add -
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          git clone "ssh://aur@aur.archlinux.org/${{ steps.meta.outputs.pkgname }}.git" aur-pkg
          cp packaging/PKGBUILD aur-pkg/
          cd aur-pkg
          makepkg --printsrcinfo > .SRCINFO
          git add PKGBUILD .SRCINFO
          git diff --staged --quiet || git commit -m "Update to $(grep -Po 'pkgver=\K[^ ]+' ../packaging/PKGBUILD)"
          git push
