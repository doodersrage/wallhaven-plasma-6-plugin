name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: Full check suite
        run: |
          chmod +x scripts/validate.sh tests/validate-qml.sh dev-helper.sh scripts/sync-i18n.sh
          ./scripts/validate.sh
          ./scripts/sync-i18n.sh
          ./tests/validate-qml.sh
          ./dev-helper.sh test

      - name: Package
        run: ./dev-helper.sh package

      - name: Verify tarball paths
        run: |
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'krunner/org.robertsm.wallhaven.desktop'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'contents/presets/curated.json'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'examples/plasma-shortcuts.md'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'packaging/PKGBUILD'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'contents/locale/es/LC_MESSAGES/org.robertsm.wallhaven.mo'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'CONTRIBUTING.md'

      - name: Packaging and Flatpak smoke
        run: |
          chmod +x scripts/validate-packaging.sh scripts/validate-flatpak.sh
          ./scripts/validate-packaging.sh
          ./scripts/validate-flatpak.sh

  neon:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Neon container smoke (build + tests)
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/kde-neon/plasma:stable \
            bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq nodejs python3-dbus python3-gi gettext cmake g++ \
                extra-cmake-modules qt6-base-dev libkf6globalaccel-dev libkf6i18n-dev libkf6coreaddons-dev >/dev/null
              ./scripts/validate.sh
              node tests/test-wallhaven.js
              python3 tests/test-variety-dbus.py
              cmake -S tools/wallhaven-shortcuts -B /tmp/build-shortcuts -DCMAKE_BUILD_TYPE=Release
              cmake --build /tmp/build-shortcuts
              test -x /tmp/build-shortcuts/wallhaven-shortcuts
              ./scripts/validate-flatpak.sh
            '
