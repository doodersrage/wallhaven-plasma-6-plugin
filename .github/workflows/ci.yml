name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext python3-dbus python3-gi ripgrep dbus

      - name: Validate plugin structure
        run: |
          chmod +x scripts/validate.sh scripts/check-config-wiring.sh scripts/smoke-offline.sh
          ./scripts/validate.sh

      - name: Sync translations
        run: |
          chmod +x scripts/sync-i18n.sh scripts/extract-messages.sh scripts/check-i18n.sh
          ./scripts/sync-i18n.sh
          ./scripts/check-i18n.sh

      - name: Run wallhaven.js tests
        run: node tests/test-wallhaven.js

      - name: Reliability smoke + control fanout
        run: |
          chmod +x tests/test-reliability-smoke.sh
          bash tests/test-reliability-smoke.sh
          python3 tests/test-control-fanout.py

      - name: Offline / optional D-Bus smoke
        run: chmod +x scripts/smoke-offline.sh && ./scripts/smoke-offline.sh

      - name: Variety D-Bus tests
        run: python3 tests/test-variety-dbus.py

      - name: D-Bus helper on a private bus (methods, signals, no shell)
        run: python3 tests/test-dbus-service.py

      - name: QML checks (structure, dangling references, dead handlers)
        run: chmod +x tests/validate-qml.sh && ./tests/validate-qml.sh

      - name: Validate tool scripts are executable
        run: |
          chmod +x tools/wallhaven-ctl.sh tools/register-shortcuts.sh tools/variety-sync.sh \
            tools/apply-panel-tint.sh tools/import-preset-url.sh tools/variety-bridge.sh \
            scripts/capture-screenshots.sh scripts/sync-i18n.sh
          python3 -m py_compile tools/wallhaven-dbus.py

      - name: Build package
        run: ./dev-helper.sh package

      - name: Verify archive contents
        run: chmod +x scripts/verify-archive.sh && ./scripts/verify-archive.sh

      - name: Packaging smoke
        run: chmod +x scripts/validate-packaging.sh && ./scripts/validate-packaging.sh

      - name: Flatpak manifest smoke
        run: chmod +x scripts/validate-flatpak.sh && ./scripts/validate-flatpak.sh

  # Loads the real wallpaper and plasmoid QML headless against the real D-Bus
  # helper. Needs Plasma 6, which ubuntu-latest does not ship, hence the Arch
  # container. Non-blocking until it has a few green runs behind it.
  qml-runtime:
    runs-on: ubuntu-latest
    continue-on-error: true
    container: archlinux:latest
    steps:
      - name: Install Plasma and test dependencies
        run: |
          pacman -Syu --noconfirm --needed git nodejs ripgrep dbus python python-dbus python-gobject \
            python-pyqt6 qt6-declarative plasma-workspace libplasma kirigami knotifications

      - uses: actions/checkout@v5

      - name: QML checks with qmllint
        run: bash tests/validate-qml.sh

      - name: Headless wallpaper + plasmoid runtime test
        env:
          WALLHAVEN_REQUIRE_QML_RUNTIME: "1"
          WALLHAVEN_TEST_SETTLE: "7"
        run: python tests/test-qml-runtime.py -v
