name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: Validate plugin structure
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh

      - name: Sync translations
        run: |
          chmod +x scripts/sync-i18n.sh scripts/extract-messages.sh scripts/check-i18n.sh
          ./scripts/sync-i18n.sh
          ./scripts/check-i18n.sh

      - name: Run wallhaven.js tests
        run: node tests/test-wallhaven.js

      - name: QML smoke checks
        run: chmod +x tests/validate-qml.sh && ./tests/validate-qml.sh

      - name: Validate tool scripts are executable
        run: |
          chmod +x tools/wallhaven-ctl.sh tools/register-shortcuts.sh tools/variety-sync.sh \
            tools/apply-panel-tint.sh tools/import-preset-url.sh tools/variety-bridge.sh \
            scripts/capture-screenshots.sh scripts/sync-i18n.sh
          python3 -m py_compile tools/wallhaven-dbus.py

      - name: Build package
        run: ./dev-helper.sh package

      - name: Verify archive contents
        run: |
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'contents/ui/main.qml'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'metadata.json'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'plasmoid/contents/ui/main.qml'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'tools/wallhaven-dbus.py'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'share/wallhaven-preset.desktop.in'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'packaging/PKGBUILD'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'contents/locale/de/LC_MESSAGES/org.robertsm.wallhaven.mo'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'contents/locale/fr/LC_MESSAGES/org.robertsm.wallhaven.mo'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'contents/locale/es/LC_MESSAGES/org.robertsm.wallhaven.mo'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'po/de.po'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'po/fr.po'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'po/es.po'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'screenshots/desktop-wallpaper.png'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'share/wallhaven-shortcuts.desktop.in'
          tar -tJf wallhaven-plasma-*.tar.xz | grep -q 'metainfo/org.robertsm.wallhaven.metainfo.xml'

      - name: Packaging smoke
        run: chmod +x scripts/validate-packaging.sh && ./scripts/validate-packaging.sh

      - name: Flatpak manifest smoke
        run: chmod +x scripts/validate-flatpak.sh && ./scripts/validate-flatpak.sh
